<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>홈페이지 관리 | 착한 나물</title><style>body{font-family:system-ui,sans-serif;background:#f5f3e9;color:#173e2c;margin:0}main{max-width:800px;margin:auto;padding:50px 24px}h1{font-size:32px}section{background:white;padding:24px;border-radius:18px;margin:20px 0}label{display:block;font-weight:700;margin:18px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #c6d3bf;border-radius:9px;font:inherit}textarea{min-height:80px}button{border:0;border-radius:30px;padding:12px 22px;background:#173e2c;color:white;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}button.secondary{background:#e5eddb;color:#173e2c}a{color:inherit}.row{border-top:1px solid #ddd;padding:12px 0}.error{color:#a33325}[hidden]{display:none!important}</style></head><body><main><a href="/">← 홈페이지로 돌아가기</a><h1>착한 나물 홈페이지 관리</h1><p>숏폼 영상과 홈페이지 문구를 관리합니다.</p><section id="login"><h2>관리자 PIN 입력</h2><form id="login-form"><label for="pin">4자리 PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required autocomplete="off"><button>관리 화면 열기</button></form></section><form id="editor" hidden><section><h2>숏폼 영상</h2><p>YouTube Shorts, Instagram, TikTok 링크를 추가할 수 있습니다. YouTube Shorts는 대표 이미지가 자동 표시됩니다.</p><div id="items"></div><button type="button" class="secondary" id="add">+ 영상 추가</button></section><section><h2>홈페이지 문구</h2><p>비워두면 기존 문구가 표시됩니다.</p><div id="fields"></div></section><button type="submit">홈페이지에 저장</button> <button class="secondary" type="button" id="logout">나가기</button></form><p id="message" role="status" class="error"></p></main><script type="module">
const $=s=>document.querySelector(s);let pin='',content={shorts:[],copy:{}};const fields={hero:'메인 제목',heroDescription:'메인 설명',storyTitle:'브랜드 스토리 제목',storyBody:'브랜드 스토리 본문',shortsTitle:'숏폼 영역 제목'};
function row(item={}){const d=document.createElement('div');d.className='row';d.innerHTML='<label>영상 제목</label><input class="title" maxlength="100" placeholder="예: 5초 나물 맛있게 먹는 법"><label>영상 링크</label><input class="url" type="url" required placeholder="https://"><button type="button" class="secondary">삭제</button>';d.querySelector('.title').value=item.title||'';d.querySelector('.url').value=item.url||'';d.querySelector('button').onclick=()=>d.remove();$('#items').append(d)}
for(const [key,label] of Object.entries(fields)){const l=document.createElement('label');l.textContent=label;const t=document.createElement('textarea');t.dataset.key=key;l.append(t);$('#fields').append(l)}
async function post(body){const r=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'오류가 발생했습니다.');return data}
$('#login-form').onsubmit=async e=>{e.preventDefault();$('#message').textContent='';try{pin=$('#pin').value;await post({pin,action:'login'});const r=await fetch('/api/content');if(!r.ok)throw Error('저장된 정보를 불러오지 못했습니다.');content=await r.json();$('#items').replaceChildren();(content.shorts||[]).forEach(row);document.querySelectorAll('[data-key]').forEach(x=>x.value=content.copy?.[x.dataset.key]||'');$('#login').hidden=true;$('#editor').hidden=false;$('#pin').value=''}catch(err){pin='';$('#message').textContent=err.message}};
$('#add').onclick=()=>row();$('#logout').onclick=()=>{pin='';$('#editor').hidden=true;$('#login').hidden=false};$('#editor').onsubmit=async e=>{e.preventDefault();$('#message').textContent='저장 중입니다…';const shorts=[...document.querySelectorAll('.row')].map(el=>({title:el.querySelector('.title').value,url:el.querySelector('.url').value}));const copy=Object.fromEntries([...document.querySelectorAll('[data-key]')].map(el=>[el.dataset.key,el.value.trim()]));try{await post({pin,shorts,copy});$('#message').textContent='저장되었습니다. 홈페이지에 바로 반영됩니다.'}catch(err){$('#message').textContent=err.message}};
</script></body></html>
